# Standalone CPU benchmark for the v0.2 fsum lane: Invar's cpu-parallel
# reductions next to rayon's unordered sum. Not a workspace member, so the
# main build never pulls this rayon. Run from this directory:
#   cargo run --release -- bench 4  (or: calibrate)
[package]
name = "fsum-cpu-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
invar = { path = "../../.." }
rayon = "=1.10.0"
