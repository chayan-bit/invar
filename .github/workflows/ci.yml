name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Test-only scheduling allowance for shared runners; semantic fuel and product bounds stay fixed.
  INVAR_TEST_TIMEOUT_SCALE: 8
  # Pull requests run a deterministic 1-in-8 sample of the corpus sweeps
  # (test-support/corpus_sample.rs); pushes to main run the whole corpus.
  INVAR_FULL_CORPUS: ${{ github.event_name == 'push' && '1' || '0' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p invar -p invar-tools --all-targets --locked -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check all targets
        run: cargo check -p invar -p invar-tools --all-targets --locked

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # One test, device_model::device_model_corpus_cpu_model_agrees_with_oracle, compiles each corpus program to C++ three times
        # (about 3 min on the pull-request sample, 19-28 min on the whole corpus). It is excluded from the four shards below and runs
        # in two jobs, each built from its own test binary only: INVAR_CORPUS_PART deals the corpus's programs (sorted by path) out
        # by index, so the two parts are disjoint and together run every program; no test is skipped overall.
        # device_model_corpus_parts_cover_the_corpus (in a shard) checks the parts cover the corpus.
        include:
          - name: shard 1/4
            args: --partition count:1/4 -E 'not test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
            doctests: true
          - name: shard 2/4
            args: --partition count:2/4 -E 'not test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
          - name: shard 3/4
            args: --partition count:3/4 -E 'not test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
          - name: shard 4/4
            args: --partition count:4/4 -E 'not test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
          - name: CPU-model corpus 1/2
            part: 1/2
            args: --test gnet_device_model --success-output final -E 'test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
          - name: CPU-model corpus 2/2
            part: 2/2
            args: --test gnet_device_model --success-output final -E 'test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
    env:
      # tests/limits/ci_profile_canary.rs checks that the ci-debug profile keeps debug assertions.
      INVAR_CI_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-debug
      - name: Test (default features, ci-debug profile)
        env:
          NEXTEST_ARGS: ${{ matrix.args }}
          # Empty (the whole corpus) outside the two corpus jobs.
          INVAR_CORPUS_PART: ${{ matrix.part }}
        # NEXTEST_ARGS is intentionally word-split (it holds flags and a quoted filterset).
        run: eval "cargo nextest run --locked --profile ci --cargo-profile ci-debug -p invar -p invar-tools $NEXTEST_ARGS"
      - name: Doctests
        if: matrix.doctests
        run: cargo test --locked --doc

  # Windows on CPU: the default-feature suite on MSVC in four shards, and a
  # gnullvm build of every test target. C++ test harnesses compile with
  # llvm-mingw's clang (pinned and checksummed below); children are bounded
  # with Git for Windows' GNU timeout. Every run takes the pull-request corpus
  # sample, so a push to main sees the same Windows result as its pull request;
  # the Linux shards run the whole corpus on main.
  # The CPU-model corpus test takes the whole runner, so it runs after msvc 1/4's
  # partition instead of inside it, where it serialized that shard's long tests;
  # left in the partition, shard 1 was the slowest Windows job by about 3 min.
  # Excluded: issue_ai_02_spec_examples_index_validates_and_every_example_matches_its_expected_output.
  # `system gen ros2` derives the UR5e base RPY with the platform libm's asin,
  # which differs from glibc by one ulp, so that tree hash is Linux-specific.
  windows:
    name: Windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc 1/4
            args: --partition count:1/4
            corpus: true
          - name: msvc 2/4
            args: --partition count:2/4
          - name: msvc 3/4
            args: --partition count:3/4
            math: true
          - name: msvc 4/4
            args: --partition count:4/4
          - name: gnullvm build
            target: x86_64-pc-windows-gnullvm
            args: --no-run
            math: true
    env:
      INVAR_CI_PROFILE: debug
      INVAR_FULL_CORPUS: 0
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out symlinks as links
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install llvm-mingw 20261006 (C++ harness compiler)
        env:
          LLVM_MINGW: llvm-mingw-20261006-ucrt-x86_64
          SHA256: 317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$LLVM_MINGW.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW.zip"
          echo "$SHA256  $RUNNER_TEMP/$LLVM_MINGW.zip" | sha256sum -c -
          7z x -o"$RUNNER_TEMP" "$RUNNER_TEMP/$LLVM_MINGW.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ matrix.target || 'msvc' }}
      - name: CORE-MATH (invar-math) tests
        if: matrix.math
        run: cargo test --locked ${TARGET:+--target "$TARGET"} -p invar-math
      - name: Test (default features, ci-debug profile)
        run: >-
          cargo nextest run --locked ${TARGET:+--target "$TARGET"} --profile ci --cargo-profile ci-debug
          -p invar -p invar-tools ${{ matrix.args }}
          -E 'not test(=issue_ai_02_spec_examples_index_validates_and_every_example_matches_its_expected_output) & not test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'
      - name: CPU-model corpus test
        if: matrix.corpus
        run: >-
          cargo nextest run --locked --profile ci --cargo-profile ci-debug -p invar -p invar-tools
          --test gnet_device_model -E 'test(=device_model::device_model_corpus_cpu_model_agrees_with_oracle)'

  # The jobs below compile the feature-gated code that the default-feature jobs never build.
  native:
    name: Build (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # llvm-sys 211 (inkwell llvm21-1-force-dynamic) links the LLVM 21 shared library under this prefix.
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      INVAR_CI_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM 21 (apt.llvm.org)
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          "$LLVM_SYS_211_PREFIX/bin/llvm-config" --version
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native
      - name: Clippy (native)
        run: cargo clippy --locked -p invar -p invar-tools --all-targets --features native -- -D warnings
      - name: Native backend tests
        run: >
          cargo nextest run --locked --profile ci --cargo-profile ci-debug --features native
          --test mir --test exports --test gnet_net --test diagnostics
          --test numeric_tiers
          -E 'not ((binary(=mir) | binary(=exports)) & not test(/^issue_(m1_02|eng_18_native_(simd|regions)|l1_06_(native_arrays|native_f32_arrays|scalar_export_core|export_failure_contract))::/)) & not (binary(=numeric_tiers) & not test(/^issue_eng_03_tier_engines::/)) & not (binary(=gnet_net) & not test(/^net_native_cpu::/)) & not (binary(=diagnostics) & not test(/^issue_dx_20_/))'
      - name: Foreign boundary (invar-foreign) clippy and tests
        run: |
          cargo clippy --locked -p invar-foreign --all-targets -- -D warnings
          cargo nextest run --locked --profile ci --cargo-profile ci-debug -p invar-foreign

  cuda:
    name: Build (cuda, compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cuda
      # cudarc loads the driver and NVRTC dynamically, so no CUDA toolkit or GPU is needed to compile.
      - name: Check (cuda)
        run: cargo check --locked -p invar -p invar-tools --all-targets --features cuda

  metal:
    name: Build (metal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: metal
      - name: Check (metal)
        run: cargo check --locked -p invar -p invar-tools --all-targets --features metal

  python:
    name: Build (python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/invar-python
          key: python
      - name: Build and install the extension (maturin pinned by pyproject.toml)
        working-directory: crates/invar-python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install maturin==1.9.6
          maturin develop --locked --extras test
      - name: Python tests (reference engine)
        working-directory: crates/invar-python
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          pytest

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File-size ratchet
        run: scripts/check-file-size
      - name: Native host bundle
        run: python3 -I scripts/check-native-host-bundle.py
      - name: Script self-tests
        run: |
          export TMPDIR="$RUNNER_TEMP"
          sh scripts/check-file-size.test.sh
          sh scripts/check-native-host-bundle.test.sh
