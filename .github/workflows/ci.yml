name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Test-only scheduling allowance for shared runners; semantic fuel and product bounds stay fixed.
  INVAR_TEST_TIMEOUT_SCALE: 8
  # Pull requests run a deterministic 1-in-8 sample of the corpus sweeps
  # (test-support/corpus_sample.rs); pushes to main run the whole corpus.
  INVAR_FULL_CORPUS: ${{ github.event_name == 'push' && '1' || '0' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p invar -p invar-tools --all-targets --locked -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check all targets
        run: cargo check -p invar -p invar-tools --all-targets --locked

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # One test, issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle, compiles each corpus program to C++ three times
        # (about 3 min on the pull-request sample, about 20 min on the whole corpus). It runs alone in its own job, built from
        # its own test binary only, and is excluded from the four shards below; no test is skipped overall.
        # "Test (CPU-model corpus)" is a required status check, so the job keeps its name.
        include:
          - name: shard 1/4
            args: --partition count:1/4 -E 'not test(=issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle)'
            doctests: true
          - name: shard 2/4
            args: --partition count:2/4 -E 'not test(=issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle)'
          - name: shard 3/4
            args: --partition count:3/4 -E 'not test(=issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle)'
          - name: shard 4/4
            args: --partition count:4/4 -E 'not test(=issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle)'
          - name: CPU-model corpus
            args: --test gnet_device_model -E 'test(=issue_gnet_03_device::issue_gnet_03_device_corpus_cpu_model_agrees_with_oracle)'
    env:
      # tests/ci_profile_canary.rs checks that the ci-debug profile keeps debug assertions.
      INVAR_CI_PROFILE: debug
    steps:
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-debug
      - name: Test (default features, ci-debug profile)
        env:
          NEXTEST_ARGS: ${{ matrix.args }}
        # NEXTEST_ARGS is intentionally word-split (it holds flags and a quoted filterset).
        run: eval "cargo nextest run --locked --profile ci --cargo-profile ci-debug -p invar -p invar-tools $NEXTEST_ARGS"
      - name: Doctests
        if: matrix.doctests
        run: cargo test --locked --doc

  # The jobs below compile the feature-gated code that the default-feature jobs never build.
  native:
    name: Build (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # llvm-sys 211 (inkwell llvm21-1-force-dynamic) links the LLVM 21 shared library under this prefix.
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      INVAR_CI_PROFILE: debug
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM 21 (apt.llvm.org)
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          "$LLVM_SYS_211_PREFIX/bin/llvm-config" --version
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native
      - name: Clippy (native)
        run: cargo clippy --locked -p invar -p invar-tools --all-targets --features native -- -D warnings
      - name: Native backend tests
        run: >
          cargo nextest run --locked --profile ci --cargo-profile ci-debug --features native
          --test issue_m1_02 --test gnet_net --test issue_dx_20_debug_command --test issue_dx_20_debug_info
          --test issue_l1_06_native_arrays --test issue_l1_06_native_f32_arrays --test issue_l1_06_scalar_export_core
          --test issue_eng_03_tier_engines --test issue_l1_06_export_failure_contract
          -E 'not binary(gnet_net) | test(/^issue_gnet_02_native::/)'

  cuda:
    name: Build (cuda, compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cuda
      # cudarc loads the driver and NVRTC dynamically, so no CUDA toolkit or GPU is needed to compile.
      - name: Check (cuda)
        run: cargo check --locked -p invar -p invar-tools --all-targets --features cuda

  metal:
    name: Build (metal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: metal
      - name: Check (metal)
        run: cargo check --locked -p invar -p invar-tools --all-targets --features metal

  python:
    name: Build (python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/invar-python
          key: python
      - name: Build and install the extension (maturin pinned by pyproject.toml)
        working-directory: crates/invar-python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install maturin==1.9.6
          maturin develop --locked --extras test
      - name: Python tests (reference engine)
        working-directory: crates/invar-python
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          pytest

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File-size ratchet
        run: scripts/check-file-size
      - name: Native host bundle
        run: python3 -I scripts/check-native-host-bundle.py
      - name: Script self-tests
        run: |
          export TMPDIR="$RUNNER_TEMP"
          sh scripts/check-file-size.test.sh
          sh scripts/check-native-host-bundle.test.sh
