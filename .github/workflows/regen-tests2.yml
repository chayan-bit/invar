name: regen-tests2 (temporary, MIR stack repro)

on:
  push:
    branches: [fix/mir-eval-own-stack]

permissions:
  contents: read

jobs:
  repro:
    name: Unoptimized dev repro (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      INVAR_TEST_TIMEOUT_SCALE: 8
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GNU timeout on macOS
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the two test binaries (dev profile, opt-level 0)
        run: cargo test --locked --no-run --test limits --test normal_form
      - name: MIR call depth on a 2 MiB thread
        if: always()
        run: cargo test --locked --test limits -- --exact issue_eval_call_depth_stack::issue_eval_call_depth_limit_is_typed_on_a_default_thread
      - name: full_ordinary_source_denominator
        if: always()
        run: cargo test --locked --test normal_form -- --exact cpu_tests::full_ordinary_source_denominator
