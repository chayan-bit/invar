name: regen-mesh

on:
  push:
    branches: [chore/strip-visual-meshes]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: regen-mesh
      - name: Build the CLI
        run: cargo build --locked --bin invar
      - name: Regenerate index hashes and scene identities
        run: python3 -I .github/regen/regen-mesh.py
      - name: Recapture the Panda home hold with the pinned MuJoCo
        run: |
          python3 -m venv /tmp/mj
          /tmp/mj/bin/pip install mujoco==3.12.0 numpy==2.5.3
          scene="regen-out/mjcf-panda/scene.xml"
          sha=$(python3 -c "import json;print(json.load(open('regen-out/scene-identities.json'))['panda'])")
          /tmp/mj/bin/python tests/fixtures/substep_admission/capture_panda_home.py "$scene" "$sha" regen-out/panda-home-diagnostic.json | tee regen-out/capture-summary.json
          sha256sum regen-out/panda-home-diagnostic.json | tee regen-out/panda-home-diagnostic.sha256
          wc -c regen-out/panda-home-diagnostic.json
          python3 .github/regen/compare_capture.py tests/fixtures/substep_admission/panda-home-diagnostic.json regen-out/panda-home-diagnostic.json 58 | tee regen-out/capture-compare.txt || true
      - name: Print the binder's actual identities
        run: |
          python3 - <<'PY'
          p = "src/system/substep_admission.rs"
          s = open(p).read()
          old = "    if identity.model_xml.hex() != model_xml || identity.assets.hex() != assets {\n        return Err(Fault::Identity);"
          assert old in s
          s = s.replace(old, "    if identity.model_xml.hex() != model_xml || identity.assets.hex() != assets {\n        eprintln!(\"QUALIFIED_ACTUAL {:?} model_xml={} assets={}\", layout, identity.model_xml.hex(), identity.assets.hex());\n        return Err(Fault::Identity);")
          open(p, "w").write(s)
          PY
          cargo test --locked --lib substep_admission -- --nocapture --test-threads 2 > regen-out/substep-lib.log 2>&1 || true
          grep -h QUALIFIED_ACTUAL regen-out/substep-lib.log | sort -u | tee regen-out/qualified-actual.txt
          git checkout src/system/substep_admission.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: regen-mesh
          path: regen-out
