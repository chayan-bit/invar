name: verify-share (temporary)
on:
  push:
    branches: [refactor/share-cuda-compile]
jobs:
  invar-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy invar-cuda with tests
        run: cargo clippy --locked -p invar-cuda --features runtime --all-targets -- -D warnings
      - name: CPU-only invar-cuda floating and transpose tests
        run: cargo test --locked -p invar-cuda --features runtime --lib -- floating transpose stencil_u32
