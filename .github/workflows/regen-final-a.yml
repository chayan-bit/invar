name: regen-final-a
on:
  push:
    branches: [final-dead-support]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  INVAR_TEST_TIMEOUT_SCALE: 8
  INVAR_FULL_CORPUS: "1"
  INVAR_CI_PROFILE: debug
jobs:
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-debug
      - name: Full-corpus floors
        run: >
          cargo nextest run --locked --profile ci --cargo-profile ci-debug --no-capture -p invar
          --test gnet_net --test gnet_device_model
          -E 'test(/issue_gnet_02_corpus/) | test(=issue_gnet_03_device::issue_gnet_03_device_corpus_admission_is_typed_and_target_independent) | test(=issue_gnet_03_device::issue_gnet_03_device_production_build_cannot_emit_the_fault_hook)'
