name: Bug report
description: Report incorrect behavior, a crash, or a misleading diagnostic.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems must not be filed here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest `.inv` program or input, and the exact command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: The complete output, including diagnostics or the panic message.
      render: text
  - type: input
    id: commit
    attributes:
      label: Invar commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, and GPU if relevant.
      placeholder: Linux x86_64, Rust 1.95.0
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Cargo features and engine
      description: Enabled features (`native`, `cuda`, `metal`) and the `--engine` or target used, if any.
