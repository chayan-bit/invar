# Linux: keep debuginfo in .dwo files next to the objects instead of linking it into every binary.
# gdb and lldb still read it; an incremental `cargo test --no-run` after a one-line edit takes 23 s
# instead of 37 s and `target/` is half the size. Not set for windows-msvc, where only `packed` is stable.
[target.'cfg(target_os = "linux")']
rustflags = ["-Csplit-debuginfo=unpacked"]
